[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "conveyor-vision-service"
version = "0.3.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "numpy>=2.1,<3.0",
  "opencv-python-headless>=4.11,<5.0",
  "requests>=2.32,<3.0",
  "minio>=7.2,<8.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
